# Render Blueprint — set service "Root Directory" to kiddex-apps/kiddex-gateway in the monorepo.
services:
  - type: web
    name: kiddex-gateway
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
